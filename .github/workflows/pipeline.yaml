name: cd-pipeline to deploy the trained ML model

on: 
  push:
    branches:
      - main

jobs:
  deploy-model:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repository
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt      

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build, tag, and push docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: first_namespace/first_ecr
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: package model into .tar.gz file
        run: tar -C models -czf model.tar.gz model.pkl scaler.pkl

      - name: upload .tar.gz file to s3
        run: aws s3 cp model.tar.gz s3://${{ secrets.S3_BUCKET }}/models/model.tar.gz

      - name: Deploy to Sagemaker
        env:
          MODEL_NAME: practice-model-${{ github.sha }}
          SAGEMAKER_ROLE: ${{ secrets.SAGEMAKER_ROLE }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/first_namespace/first_ecr:${{ github.sha }}
          MODEL_DATA_URL: s3://${{ secrets.S3_BUCKET }}/models/model.tar.gz
          ENDPOINT_NAME: practice-secondmodel-endpoint
        run: python inference/deploy.py